name: cricscore_app
description: A new Flutter project.
publish_to: 'none'

# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
version: 8.2.0+8

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  date_format:
    path: packages/date_format
  intl: ^0.20.2
  http: ^1.2.2
  dio: ^5.7.0
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  google_mobile_ads: ^5.2.0
  google_sign_in: ^6.2.2
  countdown_timer_simple:
    path: packages/countdown_timer_simple
  flutter_facebook_auth: ^7.1.1
  in_app_update: ^4.2.3
  flutter_svg: ^2.0.16
  fluttertoast: ^8.2.8
  google_fonts: ^6.2.1
  flutter_html: ^3.0.0
  package_info_plus: ^8.1.2
  facebook_audience_network_plus: ^2.0.0
  shared_preferences: ^2.3.4
  page_view_indicators:
    path: packages/page_view_indicators
  webview_flutter: ^4.10.0
  firebase_database: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/bg/
    - assets/icons/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/Poppins-Regular.ttf

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/cricscorelogo.png"
